---
- name: Surveiller les incidents ServiceNow
  hosts: all
  match_multiple_rules: true
  sources:
    - servicenow.itsm.records:
        instance:
          host: "{{ sn_host }}"
          username: "{{ sn_user }}"
          password: "{{ sn_password }}"
        table: incident
        sysparm_query: "short_descriptionLIKEnginx^state=1"
        interval: 30
        remote_servicenow_timezone: America/Los_Angeles
  rules:
    - name: Afficher les incidents nginx nouveaux
      condition: event.sys_id is defined
      action:
        print_event:
          pretty: true
    - name: Réparer nginx pour chaque incident nginx
      condition: event.sys_id is defined
      throttle:
        once_within: 2 minutes
        group_by_attributes:
          - event.sys_id
      action:
        run_job_template:
          name: restart-nginx
          organization: Default
          job_args:
            extra_vars:
              incident_sys_id: "{{ event.sys_id }}"
              incident_number: "{{ event.number }}"
              sn_host: "{{ sn_host }}"
              sn_user: "{{ sn_user }}"
              sn_password: "{{ sn_password }}"
