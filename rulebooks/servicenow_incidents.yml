---
- name: Surveiller et remedier les incidents nginx ServiceNow
  hosts: all
  match_multiple_rules: true

  sources:
    - servicenow.itsm.records:
        table: incident
        sysparm_query: "short_descriptionLIKEnginx^state=1^cmdb_ciISNOTEMPTY"
        sysparm_display_value: true
        interval: 30
        remote_servicenow_timezone: America/Los_Angeles

  rules:

    - name: Afficher les incidents nginx recus
      condition: event.sys_id is defined
      action:
        print_event:
          pretty: true

    - name: Remedier nginx sur le CI de l'incident
      condition: event.sys_id is defined and event.cmdb_ci is defined

      action:
        run_job_template:
          name: restart-nginx
          organization: Default
          job_args:
            extra_vars:
              incident_sys_id: "{{ event.sys_id }}"
              incident_number: "{{ event.number }}"
              cmdb_ci: "{{ event.cmdb_ci }}"
